kind = "web"
previewPath = "/"
title = "BookEase AI"
version = "1.0.0"
id = "artifacts/bookease"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19710

[services.development]
run = "pnpm --filter @workspace/bookease run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bookease", "run", "build" ]
publicDir = "artifacts/bookease/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19710"
BASE_PATH = "/"
